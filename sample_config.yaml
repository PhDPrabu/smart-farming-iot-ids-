dataset:
  train_split: 0.7
  validation_split: 0.1
  test_split: 0.2

tabtransformer:
  embedding_dim: 64
  transformer_layers: 4
  attention_heads: 4
  hidden_dim: 128
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 256
  epochs: 50
  early_stopping_patience: 9

lightgbm:
  num_leaves: 64
  max_depth: -1
  learning_rate: 0.05
  n_estimators: 500
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  min_data_in_leaf: 20
  lambda_l2: 0.1
